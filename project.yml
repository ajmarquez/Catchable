name: Catchable
options:
  bundleIdPrefix: com.catchable
  deploymentTarget:
    iOS: "17.0"
targets:
  Catchable:
    type: application
    platform: iOS
    sources: [Catchable, SharedWidget, WatchConnectivityShared]
    info:
      path: Catchable/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.ajmarquez.catchable
            CFBundleURLSchemes: [catchable]
    entitlements:
      path: Catchable/Catchable.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ajmarquez.catchable]
    dependencies:
      - target: CatchableWidgets
        embed: true
      - target: CatchableWatch
        embed: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.ajmarquez.catchable
        DEVELOPMENT_TEAM: A98K3QG549
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "2"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  CatchableWidgets:
    type: app-extension
    platform: iOS
    sources:
      - CatchableWidgets
      - WidgetTimeline
      - SharedWidget
      - Catchable/Models
      - Catchable/Networking
      - Catchable/Services
      - Catchable/Persistence
      - Catchable/Shared/Theme
    info:
      path: CatchableWidgets/Info.plist
      properties:
        CFBundleDisplayName: Catchable
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: CatchableWidgets/CatchableWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ajmarquez.catchable]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ajmarquez.catchable.widgets
        DEVELOPMENT_TEAM: A98K3QG549
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  CatchableWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - CatchableWatch
      - WatchConnectivityShared
      - SharedWidget
      - Catchable/Models
      - Catchable/Networking
      - Catchable/Services
      - Catchable/Shared/Theme
    dependencies:
      - target: CatchableWatchWidgets
        embed: true
    info:
      path: CatchableWatch/Info.plist
      properties:
        CFBundleDisplayName: Catchable
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.ajmarquez.catchable.watchkitapp
            CFBundleURLSchemes: [catchable]
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.ajmarquez.catchable
        WKRunsIndependentlyOfCompanionApp: true
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: CatchableWatch/CatchableWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ajmarquez.catchable]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ajmarquez.catchable.watchkitapp
        DEVELOPMENT_TEAM: A98K3QG549
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
  CatchableWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - CatchableWatchWidgets
      - WidgetTimeline
      - SharedWidget
      - Catchable/Models
      - Catchable/Networking
      - Catchable/Services
      - Catchable/Persistence
      - Catchable/Shared/Theme
    info:
      path: CatchableWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Catchable
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: CatchableWatchWidgets/CatchableWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ajmarquez.catchable]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ajmarquez.catchable.watchkitapp.widgets
        DEVELOPMENT_TEAM: A98K3QG549
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "4"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  CatchableTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CatchableTests]
    dependencies:
      - target: Catchable
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Catchable:
    build:
      targets:
        Catchable: all
    test:
      targets: [CatchableTests]
  CatchableWatch:
    build:
      targets:
        CatchableWatch: all
